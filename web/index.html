<!DOCTYPE html>
<html lang="fr">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="RaycoFieldService - Application professionnelle de gestion d'interventions, feuille de temps et dépenses pour les techniciens RaycoWylie.">
  <meta name="theme-color" content="#D1001F">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RaycoFieldService">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>RaycoFieldService • RaycoWylie</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #140004;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
    }
    #splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, #2C0008 0%, #140004 100%);
      z-index: 9999;
      transition: opacity 0.5s ease-out;
    }
    .logo-capsule {
      background: #ffffff;
      padding: 14px 28px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6), 0 0 20px rgba(209,0,31,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      animation: pulseLogo 3s ease-in-out infinite;
    }
    .logo-capsule img, .logo-capsule svg {
      height: 38px;
      width: auto;
      display: block;
    }
    .app-title {
      color: #ffffff;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }
    .badge-service {
      display: inline-block;
      background: #FFD54F;
      color: #140004;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 1px;
      padding: 3px 8px;
      border-radius: 4px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }
    .app-subtitle {
      color: rgba(255, 255, 255, 0.7);
      font-size: 13px;
      margin-bottom: 32px;
      font-weight: 500;
      max-width: 320px;
      line-height: 1.4;
    }
    .loader-bar-bg {
      width: 220px;
      height: 4px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }
    .loader-bar-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 40%;
      background: linear-gradient(90deg, #D1001F, #FF5252, #FFD54F);
      border-radius: 2px;
      animation: indeterminateBar 1.6s cubic-bezier(0.65, 0.815, 0.735, 0.395) infinite;
      box-shadow: 0 0 10px #D1001F;
    }
    .loading-status {
      margin-top: 14px;
      color: rgba(255, 255, 255, 0.45);
      font-size: 11px;
      letter-spacing: 0.3px;
    }
    @keyframes indeterminateBar {
      0% { left: -40%; width: 40%; }
      50% { left: 30%; width: 60%; }
      100% { left: 100%; width: 40%; }
    }
    @keyframes pulseLogo {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }
  </style>
</head>
<body>
  <!-- Écran de chargement moderne RaycoWylie -->
  <div id="splash-container">
    <div class="logo-capsule">
      <img src="assets/assets/images/RaycoWylie-Logo.svg" alt="RaycoWylie" onerror="this.onerror=null; this.src='assets/assets/images/raycowylie_logo.png';">
    </div>
    <div class="badge-service">Service Route & Chantier</div>
    <h1 class="app-title">RaycoFieldService</h1>
    <p class="app-subtitle">Systèmes de contrôle & sécurité pour grues</p>
    <div class="loader-bar-bg">
      <div class="loader-bar-fill"></div>
    </div>
    <div class="loading-status">Initialisation des modules en cours...</div>
  </div>

  <script>
    // Disparition en douceur de l'écran de chargement dès que Flutter affiche son contenu
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash-container');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(function() {
          splash.remove();
        }, 500);
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
